name: Prefix n8n tables once

on:
  push:
    branches:
      - feat/mvp

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp

      - name: Update workflow and docs to bt_bot_* tables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wf_path = Path('workflows/book-translator-mvp.json')
          wf = json.loads(wf_path.read_text())
          mapping = {
              'users': 'bt_bot_users',
              'tasks': 'bt_bot_tasks',
              'bot_state': 'bt_bot_state',
          }
          for node in wf.get('nodes', []):
              dt = node.get('parameters', {}).get('dataTableId')
              if isinstance(dt, dict) and dt.get('value') in mapping:
                  dt['value'] = mapping[dt['value']]
          wf_path.write_text(json.dumps(wf, ensure_ascii=False, separators=(',', ':')) + '\n')

          validator = Path('scripts/validate-workflow.mjs')
          text = validator.read_text()
          text = text.replace("'bot_state'", "'bt_bot_state'")
          text = text.replace("'tasks'", "'bt_bot_tasks'")
          text = text.replace("'users'", "'bt_bot_users'")
          validator.write_text(text)

          for rel in ['README.md', 'docs/setup.md', 'docs/data-model.md', 'docs/testing.md', 'docs/architecture.md']:
              p = Path(rel)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace('`bot_state`', '`bt_bot_state`')
              text = text.replace('`tasks`', '`bt_bot_tasks`')
              text = text.replace('`users`', '`bt_bot_users`')
              text = text.replace('tasks.telegram_update_id', 'bt_bot_tasks.telegram_update_id')
              text = text.replace('tasks.admin_task_message_id', 'bt_bot_tasks.admin_task_message_id')
              text = text.replace('tasks.status', 'bt_bot_tasks.status')
              text = text.replace('users.status', 'bt_bot_users.status')
              text = text.replace('users.user_id', 'bt_bot_users.user_id')
              p.write_text(text)

          Path('.github/workflows/prefix-tables-once.yml').unlink()
          PY

      - name: Validate
        run: npm test

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+tim8es@users.noreply.github.com"
          git add workflows/book-translator-mvp.json scripts/validate-workflow.mjs README.md docs .github/workflows/prefix-tables-once.yml
          git commit -m "fix: use bt_bot-prefixed Data Tables"
          git push origin HEAD:feat/mvp
