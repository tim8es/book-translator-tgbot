name: Update customer confirmation

on:
  push:
    branches:
      - feat/mvp

permissions:
  contents: write

jobs:
  update-message:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mvp

      - name: Update n8n confirmation message
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('workflows/book-translator-mvp.json')
          workflow = json.loads(path.read_text())
          node = next(n for n in workflow['nodes'] if n['name'] == 'Confirm Task to Customer')
          node['parameters']['text'] = "={{ 'Задача #' + $('Pick Task Number').first().json.task_no + ' принята.\\n\\nОриентировочная скорость перевода — до 15 минут на каждые 10 000 знаков.\\nФактическое время зависит от объёма и формата книги. Готовый перевод придёт в этот чат.' }}"
          path.write_text(json.dumps(workflow, ensure_ascii=False, separators=(',', ':')))
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflows/book-translator-mvp.json
          git commit -m "feat: show translation speed estimate to customer"
          git push origin HEAD:feat/mvp
