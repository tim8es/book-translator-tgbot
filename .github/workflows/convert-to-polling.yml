name: Convert Telegram input to polling

on:
  push:
    branches:
      - feat/mvp

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mvp

      - name: Replace Telegram webhook trigger with polling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('workflows/book-translator-mvp.json')
          workflow = json.loads(path.read_text())

          remove_names = {
              'Telegram Trigger',
              'Schedule Poll',
              'Prepare Poll State',
              'Webhook Setup Switch',
              'Delete Telegram Webhook',
              'Mark Webhook Deleted',
              'Telegram getUpdates',
              'Expand Telegram Update',
          }
          workflow['nodes'] = [n for n in workflow['nodes'] if n.get('name') not in remove_names]
          for name in remove_names:
              workflow.get('connections', {}).pop(name, None)

          polling_nodes = [
              {
                  'parameters': {'rule': {'interval': [{'field': 'seconds', 'secondsInterval': 5}]}},
                  'type': 'n8n-nodes-base.scheduleTrigger',
                  'typeVersion': 1.4,
                  'position': [-2260, 0],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30001',
                  'name': 'Schedule Poll',
              },
              {
                  'parameters': {
                      'mode': 'runOnceForAllItems',
                      'language': 'javaScript',
                      'jsCode': "const state = $getWorkflowStaticData('global');\nreturn [{ json: {\n  offset: Number(state.telegram_offset ?? 0),\n  needs_webhook_delete: state.telegram_webhook_deleted !== true\n} }];",
                  },
                  'type': 'n8n-nodes-base.code',
                  'typeVersion': 2,
                  'position': [-2040, 0],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30002',
                  'name': 'Prepare Poll State',
              },
              {
                  'parameters': {
                      'mode': 'expression',
                      'numberOutputs': 2,
                      'output': '={{ $json.needs_webhook_delete ? 0 : 1 }}',
                  },
                  'type': 'n8n-nodes-base.switch',
                  'typeVersion': 3.4,
                  'position': [-1820, 0],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30003',
                  'name': 'Webhook Setup Switch',
              },
              {
                  'parameters': {
                      'url': '=https://api.telegram.org/bot{{$env.TELEGRAM_BOT_TOKEN}}/deleteWebhook',
                      'options': {},
                  },
                  'type': 'n8n-nodes-base.httpRequest',
                  'typeVersion': 4.2,
                  'position': [-1600, -120],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30004',
                  'name': 'Delete Telegram Webhook',
              },
              {
                  'parameters': {
                      'mode': 'runOnceForAllItems',
                      'language': 'javaScript',
                      'jsCode': "const response = $input.first().json;\nif (response.ok !== true) throw new Error('Telegram deleteWebhook failed: ' + JSON.stringify(response));\nconst state = $getWorkflowStaticData('global');\nstate.telegram_webhook_deleted = true;\nreturn [{ json: { offset: Number($('Prepare Poll State').first().json.offset ?? 0) } }];",
                  },
                  'type': 'n8n-nodes-base.code',
                  'typeVersion': 2,
                  'position': [-1380, -120],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30005',
                  'name': 'Mark Webhook Deleted',
              },
              {
                  'parameters': {
                      'url': '=https://api.telegram.org/bot{{$env.TELEGRAM_BOT_TOKEN}}/getUpdates',
                      'sendQuery': True,
                      'queryParameters': {
                          'parameters': [
                              {'name': 'offset', 'value': '={{ $json.offset }}'},
                              {'name': 'limit', 'value': '1'},
                              {'name': 'timeout', 'value': '0'},
                              {'name': 'allowed_updates', 'value': '["message"]'},
                          ]
                      },
                      'options': {},
                  },
                  'type': 'n8n-nodes-base.httpRequest',
                  'typeVersion': 4.2,
                  'position': [-1160, 0],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30006',
                  'name': 'Telegram getUpdates',
              },
              {
                  'parameters': {
                      'mode': 'runOnceForAllItems',
                      'language': 'javaScript',
                      'jsCode': "const response = $input.first().json;\nif (response.ok !== true) throw new Error('Telegram getUpdates failed: ' + JSON.stringify(response));\nconst update = Array.isArray(response.result) ? response.result[0] : null;\nif (!update) return [];\nconst state = $getWorkflowStaticData('global');\nstate.telegram_offset = Number(update.update_id) + 1;\nif (!update.message) return [];\nreturn [{ json: update }];",
                  },
                  'type': 'n8n-nodes-base.code',
                  'typeVersion': 2,
                  'position': [-940, 0],
                  'id': 'ad84793b-b4bc-43f5-b0b9-a03d13c30007',
                  'name': 'Expand Telegram Update',
              },
          ]
          workflow['nodes'] = polling_nodes + workflow['nodes']

          connections = workflow.setdefault('connections', {})
          connections['Schedule Poll'] = {'main': [[{'node': 'Prepare Poll State', 'type': 'main', 'index': 0}]]}
          connections['Prepare Poll State'] = {'main': [[{'node': 'Webhook Setup Switch', 'type': 'main', 'index': 0}]]}
          connections['Webhook Setup Switch'] = {
              'main': [
                  [{'node': 'Delete Telegram Webhook', 'type': 'main', 'index': 0}],
                  [{'node': 'Telegram getUpdates', 'type': 'main', 'index': 0}],
              ]
          }
          connections['Delete Telegram Webhook'] = {'main': [[{'node': 'Mark Webhook Deleted', 'type': 'main', 'index': 0}]]}
          connections['Mark Webhook Deleted'] = {'main': [[{'node': 'Telegram getUpdates', 'type': 'main', 'index': 0}]]}
          connections['Telegram getUpdates'] = {'main': [[{'node': 'Expand Telegram Update', 'type': 'main', 'index': 0}]]}
          connections['Expand Telegram Update'] = {'main': [[{'node': 'Normalize + Config', 'type': 'main', 'index': 0}]]}

          workflow['active'] = False
          path.write_text(json.dumps(workflow, ensure_ascii=False, separators=(',', ':')))
          PY

          npm test

      - name: Commit polling workflow
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+tim8es@users.noreply.github.com"
          git add workflows/book-translator-mvp.json
          git commit -m "feat: poll Telegram without public webhook"
          git push origin HEAD:feat/mvp
