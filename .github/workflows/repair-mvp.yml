name: Repair MVP workflow

on:
  push:
    branches:
      - feat/mvp

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mvp

      - name: Repair workflow JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('workflows/book-translator-mvp.json')
          workflow = json.loads(path.read_text())
          nodes = workflow['nodes']
          conns = workflow['connections']

          def by_name(name):
              return next((n for n in nodes if n.get('name') == name), None)

          # Remove old polling/webhook setup nodes.
          remove_names = {
              'Schedule Poll', 'Prepare Poll State', 'Webhook Setup Switch',
              'Delete Telegram Webhook', 'Mark Webhook Deleted',
              'Telegram getUpdates', 'Expand Telegram Update',
              'Get Poll State', 'Save Poll Offset', 'Restore Telegram Update',
              'Bot Config', 'Task Update Not Seen', 'Prepare Task Messages',
          }
          nodes[:] = [n for n in nodes if n.get('name') not in remove_names]
          for name in remove_names:
              conns.pop(name, None)

          polling = [
              {
                  'parameters': {'rule': {'interval': [{'field': 'seconds', 'secondsInterval': 10}]}},
                  'type': 'n8n-nodes-base.scheduleTrigger',
                  'typeVersion': 1.2,
                  'position': [-2460, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000001',
                  'name': 'Schedule Poll',
              },
              {
                  'parameters': {
                      'mode': 'runOnceForAllItems',
                      'language': 'javaScript',
                      'jsCode': "const TELEGRAM_BOT_TOKEN = 'PASTE_TELEGRAM_BOT_TOKEN_HERE';\nconst ADMIN_USER_ID = '0';\nlet ADMIN_CHAT_ID = '0';\n\nif (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === 'PASTE_TELEGRAM_BOT_TOKEN_HERE') {\n  throw new Error('Setup required: open Bot Config and paste the Telegram bot token.');\n}\nif (ADMIN_CHAT_ID === '0' && ADMIN_USER_ID !== '0') ADMIN_CHAT_ID = ADMIN_USER_ID;\nif (ADMIN_USER_ID === '0' || ADMIN_CHAT_ID === '0') {\n  throw new Error('Setup required: open Bot Config and set ADMIN_USER_ID and ADMIN_CHAT_ID.');\n}\n\nreturn [{ json: { bot_token: TELEGRAM_BOT_TOKEN, admin_user_id: ADMIN_USER_ID, admin_chat_id: ADMIN_CHAT_ID } }];",
                  },
                  'type': 'n8n-nodes-base.code',
                  'typeVersion': 2,
                  'position': [-2240, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000002',
                  'name': 'Bot Config',
              },
              {
                  'parameters': {
                      'resource': 'row', 'operation': 'get',
                      'dataTableId': {'__rl': True, 'value': 'bot_state', 'mode': 'name'},
                      'matchType': 'allConditions',
                      'filters': {'conditions': [{'keyName': 'key', 'condition': 'eq', 'keyValue': 'telegram_offset'}]},
                      'returnAll': False, 'limit': 1,
                  },
                  'type': 'n8n-nodes-base.dataTable', 'typeVersion': 1.1,
                  'position': [-2020, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000003',
                  'name': 'Get Poll State',
                  'alwaysOutputData': True,
              },
              {
                  'parameters': {
                      'url': "={{ 'https://api.telegram.org/bot' + $('Bot Config').first().json.bot_token + '/getUpdates' }}",
                      'sendQuery': True,
                      'queryParameters': {'parameters': [
                          {'name': 'offset', 'value': '={{ Number($json.value || 0) }}'},
                          {'name': 'limit', 'value': '1'},
                          {'name': 'timeout', 'value': '0'},
                          {'name': 'allowed_updates', 'value': '[\"message\"]'},
                      ]},
                      'options': {},
                  },
                  'type': 'n8n-nodes-base.httpRequest', 'typeVersion': 4.2,
                  'position': [-1800, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000004',
                  'name': 'Telegram getUpdates',
              },
              {
                  'parameters': {
                      'mode': 'runOnceForAllItems', 'language': 'javaScript',
                      'jsCode': "const response = $input.first().json;\nif (response.ok !== true) throw new Error('Telegram getUpdates failed: ' + JSON.stringify(response));\nconst update = Array.isArray(response.result) ? response.result[0] : null;\nif (!update) return [];\nif (!update.message) return [];\nreturn [{ json: { ...update, telegram_update_id: Number(update.update_id), next_offset: Number(update.update_id) + 1 } }];",
                  },
                  'type': 'n8n-nodes-base.code', 'typeVersion': 2,
                  'position': [-1580, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000005',
                  'name': 'Expand Telegram Update',
              },
              {
                  'parameters': {
                      'resource': 'row', 'operation': 'update',
                      'dataTableId': {'__rl': True, 'value': 'bot_state', 'mode': 'name'},
                      'matchType': 'allConditions',
                      'filters': {'conditions': [{'keyName': 'key', 'condition': 'eq', 'keyValue': 'telegram_offset'}]},
                      'columns': {
                          'mappingMode': 'defineBelow',
                          'value': {'value': '={{ $json.next_offset }}'},
                          'schema': [{'id': 'value', 'displayName': 'value', 'required': False, 'defaultMatch': False, 'display': True, 'type': 'number', 'canBeUsedToMatch': True}],
                      },
                      'options': {},
                  },
                  'type': 'n8n-nodes-base.dataTable', 'typeVersion': 1.1,
                  'position': [-1360, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000006',
                  'name': 'Save Poll Offset',
              },
              {
                  'parameters': {
                      'mode': 'runOnceForAllItems', 'language': 'javaScript',
                      'jsCode': "const update = { ...$('Expand Telegram Update').first().json };\ndelete update.next_offset;\nreturn [{ json: update }];",
                  },
                  'type': 'n8n-nodes-base.code', 'typeVersion': 2,
                  'position': [-1140, 0],
                  'id': 'b93bf293-850b-4c9c-bb30-000000000007',
                  'name': 'Restore Telegram Update',
              },
          ]
          nodes[:0] = polling

          normalize = by_name('Normalize + Config')
          normalize['parameters']['jsCode'] = "const update = $input.first().json;\nconst m = update.message ?? {};\nconst f = m.from ?? {};\nconst c = m.chat ?? {};\nconst d = m.document ?? null;\nconst cfg = $('Bot Config').first().json;\n\nconst filename = d?.file_name ?? '';\nconst ext = filename.includes('.') ? filename.split('.').pop().toLowerCase() : '';\nconst text = String(m.text ?? m.caption ?? '');\n\nreturn [{ json: {\n  telegram_update_id: Number(update.telegram_update_id ?? update.update_id ?? 0),\n  sender_id: String(f.id ?? ''),\n  chat_id: String(c.id ?? ''),\n  username: String(f.username ?? ''),\n  name: [f.first_name, f.last_name].filter(Boolean).join(' '),\n  text,\n  document_file_id: String(d?.file_id ?? ''),\n  document_filename: filename,\n  document_extension: ext,\n  reply_to_message_id: m.reply_to_message?.message_id ?? null,\n  is_start: /^\\/start(?:@\\w+)?(?:\\s|$)/i.test(text),\n  has_document: Boolean(d?.file_id),\n  is_supported_document: Boolean(d?.file_id && ['epub','pdf','docx','txt'].includes(ext)),\n  received_at: new Date().toISOString(),\n  admin_user_id: String(cfg.admin_user_id),\n  admin_chat_id: String(cfg.admin_chat_id),\n  is_admin: String(f.id ?? '') === String(cfg.admin_user_id)\n} }];"

          # Add task-level idempotency guard for source uploads.
          task_update_guard = {
              'parameters': {
                  'resource': 'row', 'operation': 'rowNotExists',
                  'dataTableId': {'__rl': True, 'value': 'tasks', 'mode': 'name'},
                  'matchType': 'allConditions',
                  'filters': {'conditions': [{'keyName': 'telegram_update_id', 'condition': 'eq', 'keyValue': '={{ $json.telegram_update_id }}'}]},
              },
              'type': 'n8n-nodes-base.dataTable', 'typeVersion': 1.1,
              'position': [-500, 240],
              'id': 'b93bf293-850b-4c9c-bb30-000000000008',
              'name': 'Task Update Not Seen',
          }
          nodes.append(task_update_guard)

          prepare_messages = {
              'parameters': {
                  'mode': 'runOnceForAllItems', 'language': 'javaScript',
                  'jsCode': "const s = $input.first().json;\nconst client = s.username ? '@' + s.username : (s.name || 'без username');\nreturn [{ json: {\n  ...s,\n  admin_task_text: `📚 Новая задача #${s.task_no}\\n\\nКлиент: ${client}\\nUser ID: ${s.sender_id}\\nФайл: ${s.document_filename}\\nСтатус: PROCESSING\\n\\nКогда перевод будет готов, ответьте на это сообщение готовым файлом.`,\n  source_caption: `Задача #${s.task_no} — исходный файл`,\n  customer_confirmation_text: `Задача #${s.task_no} принята.\\n\\nОриентировочная скорость перевода — до 15 минут на каждые 10 000 знаков.\\nФактическое время зависит от объёма и формата книги. Готовый перевод придёт в этот чат.`\n} }];",
              },
              'type': 'n8n-nodes-base.code', 'typeVersion': 2,
              'position': [160, 240],
              'id': 'b93bf293-850b-4c9c-bb30-000000000009',
              'name': 'Prepare Task Messages',
          }
          nodes.append(prepare_messages)

          # Insert telegram_update_id into task write mapping/schema.
          insert = by_name('Insert Task')
          insert['parameters']['columns']['value']['telegram_update_id'] = '={{ $json.telegram_update_id }}'
          schema = insert['parameters']['columns']['schema']
          if not any(x.get('id') == 'telegram_update_id' for x in schema):
              schema.insert(1, {'id': 'telegram_update_id', 'displayName': 'telegram_update_id', 'required': False, 'defaultMatch': False, 'display': True, 'type': 'number', 'canBeUsedToMatch': True})

          # Make message expressions simple and import-safe.
          by_name('Send Admin Task Card')['parameters']['text'] = "={{ $('Prepare Task Messages').first().json.admin_task_text }}"
          by_name('Send Source to Admin')['parameters'].setdefault('additionalFields', {})['caption'] = "={{ $('Prepare Task Messages').first().json.source_caption }}"
          by_name('Confirm Task to Customer')['parameters']['text'] = "={{ $('Prepare Task Messages').first().json.customer_confirmation_text }}"

          # Disable n8n attribution for every sendMessage action.
          for n in nodes:
              if n.get('type') == 'n8n-nodes-base.telegram' and n.get('parameters', {}).get('operation') == 'sendMessage':
                  n['parameters'].setdefault('additionalFields', {})['appendAttribution'] = False

          # Rewire polling path.
          conns['Schedule Poll'] = {'main': [[{'node': 'Bot Config', 'type': 'main', 'index': 0}]]}
          conns['Bot Config'] = {'main': [[{'node': 'Get Poll State', 'type': 'main', 'index': 0}]]}
          conns['Get Poll State'] = {'main': [[{'node': 'Telegram getUpdates', 'type': 'main', 'index': 0}]]}
          conns['Telegram getUpdates'] = {'main': [[{'node': 'Expand Telegram Update', 'type': 'main', 'index': 0}]]}
          conns['Expand Telegram Update'] = {'main': [[{'node': 'Save Poll Offset', 'type': 'main', 'index': 0}]]}
          conns['Save Poll Offset'] = {'main': [[{'node': 'Restore Telegram Update', 'type': 'main', 'index': 0}]]}
          conns['Restore Telegram Update'] = {'main': [[{'node': 'Normalize + Config', 'type': 'main', 'index': 0}]]}

          # Rewire source-upload path through idempotency and message preparation.
          cis = conns['Customer Input Switch']['main']
          cis[1] = [{'node': 'Task Update Not Seen', 'type': 'main', 'index': 0}]
          conns['Task Update Not Seen'] = {'main': [[{'node': 'Generate Task Candidates', 'type': 'main', 'index': 0}]]}
          conns['Pick Task Number'] = {'main': [[{'node': 'Prepare Task Messages', 'type': 'main', 'index': 0}]]}
          conns['Prepare Task Messages'] = {'main': [[{'node': 'Insert Task', 'type': 'main', 'index': 0}]]}

          workflow['active'] = False
          path.write_text(json.dumps(workflow, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No workflow changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+tim8es@users.noreply.github.com"
          git add workflows/book-translator-mvp.json
          git commit -m "fix: harden Telegram polling and task deduplication"
          git push origin HEAD:feat/mvp
