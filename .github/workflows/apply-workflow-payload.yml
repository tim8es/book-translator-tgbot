name: Apply resilient workflow payload

on:
  push:
    branches: ["feat/mvp"]
    paths:
      - "scripts/apply-resilient-workflow.flag"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild workflow export
        run: cat scripts/workflow-payload/*.part | base64 -d > workflows/book-translator-mvp.json
      - name: Validate generated workflow
        run: npm test
      - name: Commit generated workflow
        run: |
          rm scripts/apply-resilient-workflow.flag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflows/book-translator-mvp.json scripts/apply-resilient-workflow.flag
          git commit -m "feat: add resilient low-resource delivery workflow"
          git push origin HEAD:feat/mvp
